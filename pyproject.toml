[project]
name = "claim-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bburrows", email = "bburrowsny@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
claim-reader = "claim_reader:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
